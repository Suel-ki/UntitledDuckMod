modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/UntitledDuckDevs/UntitledDuckMod/issues"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "Suel_ki, Okabintaro, ArtistMonster24"
logoFile = "logo.png"
credits = "Thanks to geckolib and architectury!"
description = '''
${description}
'''

[[dependencies.untitledduckmod]]
modId = "neoforge"
mandatory = true
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.untitledduckmod]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.untitledduckmod]]
modId = "geckolib"
mandatory = true
versionRange = "[5.5,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config="untitledduckmod.mixins.json"

